# F27-T13 / M8 · JVM settings, sized from what actually crashed.
#
# Three Gradle crash dumps sat in android/ (Aug 30, Aug 31, Sep 6). Reading
# them changes the fix: every one is a NATIVE allocation failure
# ("malloc failed ... Chunk::new"), with the machine at 835 MB free of 16 GB
# and the page file down to 2 MB available. The Gradle daemon's own working
# set peaked at 759 MB. So the build did not run out of Java heap — the
# machine ran out of memory, with Docker, an emulator and the IDE alongside.
#
# Raising -Xmx would therefore have made it WORSE: a bigger Java heap
# reserves more address space and squeezes the native heap that failed. The
# settings below go the other way, and cut one whole JVM out of the build.
#
#   -Xmx2G                      down from 3G; R8 on this app peaks far below it
#   MaxMetaspaceSize=512m       down from 1G
#   ReservedCodeCacheSize=256m  down from 512m
#   (HeapDumpOnOutOfMemoryError removed: it cannot fire on a native OOM,
#    and when it does fire it writes a multi-GB file on a machine that is
#    already out of memory.)
#
# If a release build ever does fail on Java heap, it fails loudly with
# OutOfMemoryError and the number here is the thing to raise. See docs/BUILD.md.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m

# One JVM instead of two. This app has almost no Kotlin (MainActivity and
# this build script), so a separate Kotlin daemon costs a few hundred MB of
# a starved machine to compile a handful of files.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
