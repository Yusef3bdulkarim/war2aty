# Static analysis configuration for War2aty.
# Strict lints on a fresh codebase — cheap now, painful to add later.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Fail loudly on implicit dynamic / loose casts.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  # Promote critical lints to build-breaking errors (privacy + safety).
  errors:
    avoid_print: error
    avoid_dynamic_calls: error
  # Generated code (Drift) is not hand-written; don't lint it.
  exclude:
    - "**/*.g.dart"
    - "**/*.drift.dart"

linter:
  rules:
    # --- const / immutability ---
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    # --- no debug output ---
    - avoid_print
    # --- final by default ---
    - prefer_final_locals
    - prefer_final_in_for_each
    # --- clarity / safety ---
    - always_declare_return_types
    - avoid_dynamic_calls
    - unawaited_futures
    - use_super_parameters
    - unnecessary_late
    - unnecessary_lambdas
    - avoid_redundant_argument_values
    # --- style / consistency ---
    - prefer_single_quotes
    - directives_ordering
    - sort_pub_dependencies
