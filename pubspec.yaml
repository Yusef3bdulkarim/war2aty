name: war2aty
description: "War2aty — Egyptian Arabic OCR paper-explainer app."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  camera: ^0.12.0+2
  connectivity_plus: ^7.3.1
  cryptography: ^2.7.0
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  doclens: ^0.0.8
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  flutter_tesseract_ocr: ^0.4.31
  flutter_tts: ^4.2.5
  get_it: ^9.2.1
  go_router: ^17.3.0
  image: ^4.9.1
  image_picker: ^1.2.3
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  supabase_flutter: ^2.16.0
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf

  assets:
    - assets/app_icon.png
    - assets/tessdata_config.json
    - assets/tessdata/ara.traineddata
    - assets/tessdata/eng.traineddata
    - assets/fixtures/analysis/
